<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LACVAY Dashboard - Batangas City Transportation & Tourism</title>
  <script>
    // Redirect to the design dashboard
    window.location.href = 'design/index.html';
  </script>
  <style>
    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #4CAF50 0%, #7FFF00 100%);
    }
    
    .loading-container {
      text-align: center;
      color: white;
      background: rgba(0, 0, 0, 0.2);
      padding: 40px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }
    
    p {
      margin: 8px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="loading-container">
    <div class="loading-spinner"></div>
    <h1>Loading Dashboard...</h1>
    <p>Redirecting to LACVAY Dashboard</p>
  </div>
</body>
</html>
